# Refresh live World Pulse snapshots on a schedule.
# Scheduled runs only fire once this workflow file is on the repository default branch (usually main).
# The first time this file is pushed, the git credential needs the `workflow` scope
# (classic PAT: workflow; fine-grained PAT: Workflows read/write). After that, scheduled
# runs commit data files with the default GITHUB_TOKEN (contents: write) and do not need
# a personal secret.
name: Refresh data
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours; GitHub may delay scheduled jobs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch news, conflicts, disasters and hazards
        run: node scripts/fetch-data.mjs
      - name: Refresh official public cameras
        run: node scripts/fetch-cameras.mjs
      - name: Commit data if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh $(date -u +%FT%TZ)"
            git pull --rebase -q
            git push
          fi
